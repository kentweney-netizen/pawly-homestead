<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>PAWLY ESTATE · Homestead</title>
  <link rel="stylesheet" href="homestead.css?v=w1" />
</head>
<body>
  <div id="boot">Loading homestead…</div>
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="bar">
      <b>PAWLY HOMESTEAD</b>
      <span id="stat"></span>
    </div>
    <p id="quest">Tap the house, rest once, then plant the 4 beds.</p>
    <div id="dock">
      <button type="button" id="btnOrders">Orders</button>
      <button type="button" id="btnHouse">House</button>
    </div>
  </div>
  <div id="pick">
    <h2>PAWLY ESTATE</h2>
    <p>No wallet needed. Choose a farmer and tend 4 beds.</p>
    <button type="button" id="pickBoy">Boy</button>
    <button type="button" id="pickGirl">Girl</button>
  </div>
  <div id="shop" hidden></div>
  <script src="homestead.js?v=w1"></script>
</body>
</html>
